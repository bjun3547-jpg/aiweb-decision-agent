# 本地用 Docker 验证线上形态
#
#   1. 把 backend/.env.example 复制成 backend/.env 并填好 Key
#   2. docker compose up --build
#   3. 打开 http://127.0.0.1:8000
#
# 这个文件只用于本地验证；真正的线上部署看 docs/05-部署指南.md

services:
  app:
    build:
      context: .
      args:
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: aiweb-agent:local
    container_name: aiweb-agent
    ports:
      - "8000:8000"
    # 密钥从 backend/.env 读，文件不存在时 compose 会报错——
    # 这是故意的：宁可启动失败，也不要静默跑成一个没 Key 的实例
    env_file:
      - backend/.env
    environment:
      # 允许用 shell 里的 LLM_MOCK 覆盖 .env 里的值
      LLM_MOCK: ${LLM_MOCK:-0}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health?skip_balance=true', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
